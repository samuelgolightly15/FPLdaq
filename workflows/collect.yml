name: Collect FPL snapshot

on:
  schedule:
    # Twice an hour, away from the busy on-the-hour slot. GitHub drops
    # scheduled runs under load, so two attempts roughly halve the odds of
    # losing an hour entirely. The collector skips a run if the previous one
    # was under 20 minutes ago, so this does not double the data.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take snapshot
        run: python scripts/collect.py

      - name: Rebuild site data
        run: python scripts/aggregate.py

      - name: Commit and push
        run: |
          git config user.name "fpl-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data docs)" ]; then
            echo "Nothing new to commit"
            exit 0
          fi

          git add data docs
          git commit -m "snapshot $(date -u +'%Y-%m-%dT%H:00Z')"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
